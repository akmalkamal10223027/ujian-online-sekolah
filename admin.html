<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Ujian - Guru</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #f0f4f8; color: #1e293b; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .header { background: #1e293b; color: white; padding: 20px; border-radius: 16px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .header h1 { font-size: 20px; font-weight: 700; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .stat-card { background: white; padding: 16px; border-radius: 12px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .stat-card .num { font-size: 24px; font-weight: 800; color: #2563eb; }
        .stat-card .num.blocked { color: #dc2626; }
        .stat-card .num.warning { color: #f59e0b; }
        .stat-card .label { font-size: 12px; color: #64748b; margin-top: 4px; }
        .controls { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
        .search-box { flex: 1; min-width: 250px; display: flex; gap: 10px; }
        .search-box input { flex: 1; padding: 10px 14px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 14px; transition: 0.2s; }
        .search-box input:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        .btn { padding: 10px 16px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; transition: 0.2s; display: flex; align-items: center; gap: 6px; }
        .btn-primary { background: #2563eb; color: white; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-danger { background: #dc2626; color: white; }
        .btn-danger:hover { background: #b91c1c; }
        .btn-warning { background: #f59e0b; color: white; }
        .btn-warning:hover { background: #d97706; }
        .btn-success { background: #16a34a; color: white; }
        .btn-success:hover { background: #15803d; }
        .table-wrapper { overflow-x: auto; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        table { width: 100%; background: white; border-collapse: collapse; min-width: 800px; }
        th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background: #f8fafc; font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; color: #475569; }
        td { font-size: 14px; }
        tr:hover { background: #f8fafc; }
        .status { padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; text-transform: uppercase; display: inline-block; }
        .status.active { background: #dcfce7; color: #16a34a; }
        .status.blocked { background: #fee2e2; color: #dc2626; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        .btn-action { padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 11px; margin: 2px; transition: 0.2s; }
        .btn-unblock { background: #2563eb; color: white; }
        .btn-unblock:hover { background: #1d4ed8; transform: translateY(-1px); }
        .btn-delete { background: #dc2626; color: white; }
        .btn-delete:hover { background: #b91c1c; transform: translateY(-1px); }
        .btn-action:disabled { background: #cbd5e1; cursor: not-allowed; opacity: 0.5; transform: none; }
        .empty-state { text-align: center; padding: 40px; color: #64748b; }
        .empty-state span { font-size: 40px; display: block; margin-bottom: 10px; }
        .debug-info { background: #fef3c7; border: 1px solid #fbbf24; padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; font-size: 12px; display: flex; align-items: center; gap: 8px; }
        .debug-info.success { background: #dcfce7; border-color: #16a34a; color: #166534; }
        .debug-info.error { background: #fee2e2; border-color: #dc2626; color: #991b1b; }
        .footer { text-align: center; padding: 20px; color: #64748b; font-size: 12px; }
        .violation-text { font-size: 11px; color: #64748b; margin-top: 4px; font-style: italic; max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .duplicate-badge { background: #fef3c7; color: #92400e; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 700; margin-left: 6px; }
        @media (max-width: 768px) {
            th, td { padding: 8px 10px; font-size: 13px; }
            .btn-action { padding: 4px 8px; font-size: 10px; }
            .header { flex-direction: column; text-align: center; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>👨‍🏫 Dashboard Admin Ujian</h1>
            <div style="display: flex; align-items: center; gap: 10px;">
                <span>🕒 <strong id="clock">-</strong></span>
                <button class="btn btn-primary" onclick="forceRefresh()">🔄 Refresh</button>
            </div>
        </div>

        <!-- Debug/Status Info -->
        <div id="debugInfo" class="debug-info">
            <span>🔍</span> <span id="debugText">Connecting to Firebase...</span>
        </div>
        
        <!-- Statistics Cards -->
        <div class="stats">
            <div class="stat-card">
                <div class="num" id="total">0</div>
                <div class="label">Total Siswa</div>
            </div>
            <div class="stat-card">
                <div class="num" id="active">0</div>
                <div class="label">Sedang Ujian</div>
            </div>
            <div class="stat-card">
                <div class="num blocked" id="blocked">0</div>
                <div class="label">Diblokir ⚠️</div>
            </div>
            <div class="stat-card">
                <div class="num warning" id="duplicates">0</div>
                <div class="label">Duplikat</div>
            </div>
        </div>
        
        <!-- Controls -->
        <div class="controls">
            <div class="search-box">
                <input type="text" id="search" placeholder="🔍 Cari nama atau kelas..." oninput="filterTable()">
            </div>
            <button class="btn btn-warning" onclick="showDuplicates()">🔍 Lihat Duplikat</button>
            <button class="btn btn-danger" onclick="deleteAllDuplicates()">🗑️ Hapus Semua Duplikat</button>
            <button class="btn btn-success" onclick="exportData()">📥 Export CSV</button>
        </div>
        
        <!-- Student Table -->
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Nama</th>
                        <th>Kelas</th>
                        <th>Absen</th>
                        <th>Pelanggaran</th>
                        <th>Status</th>
                        <th>Waktu</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="studentTable">
                    <tr><td colspan="7" class="empty-state"><span>⏳</span>Menunggu siswa mulai ujian...</td></tr>
                </tbody>
            </table>
        </div>

        <div class="footer">
            <p>🔄 Update otomatis • Terakhir: <span id="lastUpdate">-</span></p>
            <p style="margin-top: 5px;">💡 Klik "🔓 Buka" untuk unblock • Klik "🗑️" untuk hapus data</p>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    
    <script>
        // ==========================================
        // 🔑 FIREBASE CONFIG
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyAF6yk93vlkimK8jIz2yw8y_3JgSd3GI08",
            authDomain: "ujianonline-b5d6f.firebaseapp.com",
            databaseURL: "https://ujianonline-b5d6f-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "ujianonline-b5d6f",
            storageBucket: "ujianonline-b5d6f.firebasestorage.app",
            messagingSenderId: "485416468855",
            appId: "1:485416468855:web:a6bacc4632d1cf59eaa172",
            measurementId: "G-MN37CV5DSZ"
        };

        // ==========================================
        // INITIALIZE
        // ==========================================
        let db, allStudents = {}, debugEl, debugText;

        function init() {
            debugEl = document.getElementById('debugInfo');
            debugText = document.getElementById('debugText');

            try {
                firebase.initializeApp(firebaseConfig);
                db = firebase.database();
                updateDebug('✅ Connected! Listening to /exams...', 'success');
                console.log('✅ Firebase initialized');
                startClock();
                startListener();
            } catch (error) {
                console.error('❌ Init error:', error);
                updateDebug(`❌ Error: ${error.message}`, 'error');
            }
        }

        // ==========================================
        // CLOCK
        // ==========================================
        function startClock() {
            function update() {
                const now = new Date();
                document.getElementById('clock').textContent = now.toLocaleTimeString('id-ID', {
                    hour: '2-digit', minute: '2-digit', second: '2-digit'
                });
                document.getElementById('lastUpdate').textContent = now.toLocaleTimeString('id-ID');
            }
            update();
            setInterval(update, 1000);
        }

        // ==========================================
        // FIREBASE LISTENER
        // ==========================================
        function startListener() {
            console.log('📡 Listening to exams...');
            
            db.ref('exams').on('value', 
                (snap) => {
                    console.log('📥 Data received:', snap.val());
                    allStudents = snap.val() || {};
                    console.log('📊 Total students:', Object.keys(allStudents).length);
                    
                    renderTable();
                    updateStats();
                    checkDuplicates();
                    
                    const count = Object.keys(allStudents).length;
                    if (count > 0) {
                        updateDebug(`✅ Active! ${count} student(s) taking exam`, 'success');
                    }
                },
                (error) => {
                    console.error('❌ Firebase error:', error);
                    updateDebug(`❌ Error: ${error.message}. Cek Firebase Rules!`, 'error');
                }
            );
        }

        // ==========================================
        // CHECK DUPLICATES
        // ==========================================
        function checkDuplicates() {
            const students = Object.values(allStudents).filter(s => s && s.name);
            const nameClassMap = {};
            let dupCount = 0;

            students.forEach((student, index) => {
                const key = `${student.name.toLowerCase()}_${student.kelas}_${student.number}`;
                if (!nameClassMap[key]) {
                    nameClassMap[key] = [];
                }
                nameClassMap[key].push(student);
            });

            Object.values(nameClassMap).forEach(group => {
                if (group.length > 1) {
                    dupCount += group.length - 1; // Count duplicates (exclude first)
                }
            });

            document.getElementById('duplicates').textContent = dupCount;
        }

        // ==========================================
        // RENDER TABLE
        // ==========================================
        function renderTable() {
            const tbody = document.getElementById('studentTable');
            const search = document.getElementById('search').value.toLowerCase();
            
            const filtered = Object.entries(allStudents).filter(([id, data]) => {
                if (!data || !data.name) return false;
                const matchSearch = !search || 
                    data.name.toLowerCase().includes(search) || 
                    (data.kelas && data.kelas.toLowerCase().includes(search));
                return matchSearch;
            });

            if (filtered.length === 0) {
                const msg = Object.keys(allStudents).length === 0 
                    ? '⏳ Menunggu siswa mulai ujian...' 
                    : '📭 Tidak ada siswa yang sesuai pencarian';
                tbody.innerHTML = `<tr><td colspan="7" class="empty-state"><span>${msg.includes('Menunggu') ? '⏳' : '📭'}</span>${msg}</td></tr>`;
                return;
            }

            // Sort by startTime (newest first)
            filtered.sort((a, b) => {
                const timeA = a[1].startTime ? new Date(a[1].startTime).getTime() : 0;
                const timeB = b[1].startTime ? new Date(b[1].startTime).getTime() : 0;
                return timeB - timeA;
            });

            // Check for duplicates
            const nameClassCount = {};
            filtered.forEach(([id, data]) => {
                const key = `${data.name.toLowerCase()}_${data.kelas}_${data.number}`;
                nameClassCount[key] = (nameClassCount[key] || 0) + 1;
            });

            tbody.innerHTML = filtered.map(([id, data]) => {
                const isBlocked = data.isBlocked || data.status === 'blocked';
                const violationColor = (data.violations || 0) > 0 ? '#dc2626' : 'inherit';
                const statusClass = isBlocked ? 'blocked' : 'active';
                const statusText = isBlocked ? 'BLOCKED' : 'ACTIVE';
                
                const key = `${data.name.toLowerCase()}_${data.kelas}_${data.number}`;
                const isDuplicate = nameClassCount[key] > 1;
                const duplicateBadge = isDuplicate ? '<span class="duplicate-badge">DUPLIKAT</span>' : '';
                
                const startTime = data.startTime ? new Date(data.startTime).toLocaleString('id-ID') : '-';

                return `
                    <tr>
                        <td><strong>${escapeHtml(data.name)}</strong>${duplicateBadge}</td>
                        <td>${escapeHtml(data.kelas || '-')}</td>
                        <td>${escapeHtml(data.number || '-')}</td>
                        <td style="font-weight:600; color:${violationColor}">
                            ${data.violations || 0}
                            ${data.lastViolation ? `<div class="violation-text">"${escapeHtml(data.lastViolation)}"</div>` : ''}
                        </td>
                        <td><span class="status ${statusClass}">${statusText}</span></td>
                        <td style="font-size:11px; color:#64748b">${startTime}</td>
                        <td>
                            <button class="btn-action btn-unblock" onclick="unblock('${id}', '${escapeHtml(data.name)}')" 
                                ${!isBlocked ? 'disabled' : ''} title="Buka blokir">
                                🔓 Buka
                            </button>
                            <button class="btn-action btn-delete" onclick="deleteStudent('${id}', '${escapeHtml(data.name)}')" 
                                title="Hapus data siswa">
                                🗑️ Hapus
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // ==========================================
        // UPDATE STATS
        // ==========================================
        function updateStats() {
            const students = Object.values(allStudents).filter(s => s && s.name);
            document.getElementById('total').textContent = students.length;
            document.getElementById('active').textContent = students.filter(s => s.status === 'active' && !s.isBlocked).length;
            document.getElementById('blocked').textContent = students.filter(s => s.status === 'blocked' || s.isBlocked).length;
        }

        // ==========================================
        // UNBLOCK FUNCTION
        // ==========================================
        window.unblock = function(id, name) {
            if (!confirm(`Buka blokir untuk ${name}?`)) return;
            
            updateDebug(`🔓 Membuka blokir ${name}...`, 'success');
            
            db.ref(`exams/${id}`).update({ 
                isBlocked: false, 
                status: 'active',
                unblockedAt: new Date().toISOString()
            })
            .then(() => {
                updateDebug(`✅ ${name} unblocked`, 'success');
            })
            .catch(err => {
                updateDebug(`❌ Error: ${err.message}`, 'error');
                console.error('Unblock error:', err);
            });
        };

        // ==========================================
        // DELETE SINGLE STUDENT
        // ==========================================
        window.deleteStudent = function(id, name) {
            if (!confirm(`⚠️ Yakin ingin menghapus data ${name}?\n\nData yang dihapus tidak bisa dikembalikan!`)) return;
            
            updateDebug(`🗑️ Menghapus ${name}...`, 'success');
            
            db.ref(`exams/${id}`).remove()
            .then(() => {
                updateDebug(`✅ ${name} berhasil dihapus`, 'success');
                alert(`✅ Data ${name} berhasil dihapus!`);
            })
            .catch(err => {
                updateDebug(`❌ Gagal menghapus: ${err.message}`, 'error');
                alert(`❌ Gagal: ${err.message}`);
                console.error('Delete error:', err);
            });
        };

        // ==========================================
        // SHOW DUPLICATES
        // ==========================================
        window.showDuplicates = function() {
            const searchInput = document.getElementById('search');
            const students = Object.values(allStudents).filter(s => s && s.name);
            const nameClassMap = {};

            students.forEach(student => {
                const key = `${student.name.toLowerCase()}_${student.kelas}_${student.number}`;
                if (!nameClassMap[key]) {
                    nameClassMap[key] = [];
                }
                nameClassMap[key].push(student);
            });

            const duplicates = Object.values(nameClassMap).filter(group => group.length > 1);
            
            if (duplicates.length === 0) {
                alert('✅ Tidak ada data duplikat!');
                searchInput.value = '';
                filterTable();
                return;
            }

            const dupNames = duplicates.map(group => `${group[0].name} (${group[0].kelas} - ${group[0].number}): ${group.length} data`).join('\n');
            alert(`📊 Ditemukan ${duplicates.length} data duplikat:\n\n${dupNames}`);
            
            // Filter to show only duplicates
            const firstDup = duplicates[0][0];
            searchInput.value = firstDup.name;
            filterTable();
        };

        // ==========================================
        // DELETE ALL DUPLICATES
        // ==========================================
        window.deleteAllDuplicates = function() {
            const students = Object.values(allStudents).filter(s => s && s.name);
            const nameClassMap = {};

            students.forEach((student, index) => {
                const key = `${student.name.toLowerCase()}_${student.kelas}_${student.number}`;
                if (!nameClassMap[key]) {
                    nameClassMap[key] = [];
                }
                nameClassMap[key].push({id: Object.keys(allStudents)[index], ...student});
            });

            const duplicates = Object.values(nameClassMap).filter(group => group.length > 1);
            
            if (duplicates.length === 0) {
                alert('✅ Tidak ada data duplikat!');
                return;
            }

            let totalDup = 0;
            duplicates.forEach(group => {
                totalDup += group.length - 1; // Exclude first (keep original)
            });

            if (!confirm(`⚠️ Yakin ingin menghapus ${totalDup} data duplikat?\n\nData asli akan tetap dipertahankan.`)) return;

            updateDebug(`🗑️ Menghapus ${totalDup} data duplikat...`, 'success');

            // Delete duplicates (keep first occurrence)
            const deletePromises = [];
            duplicates.forEach(group => {
                // Skip first (keep it), delete the rest
                for (let i = 1; i < group.length; i++) {
                    deletePromises.push(db.ref(`exams/${group[i].id}`).remove());
                }
            });

            Promise.all(deletePromises)
            .then(() => {
                updateDebug(`✅ Berhasil menghapus ${totalDup} data duplikat`, 'success');
                alert(`✅ Berhasil menghapus ${totalDup} data duplikat!`);
            })
            .catch(err => {
                updateDebug(`❌ Gagal: ${err.message}`, 'error');
                alert(`❌ Gagal: ${err.message}`);
                console.error('Delete duplicates error:', err);
            });
        };

        // ==========================================
        // EXPORT TO CSV
        // ==========================================
        window.exportData = function() {
            const students = Object.values(allStudents).filter(s => s && s.name);
            
            if (students.length === 0) {
                alert('📭 Tidak ada data untuk diexport!');
                return;
            }

            let csv = 'NAMA,KELAS,ABSEN,PELANGGARAN,STATUS,START TIME\n';
            students.forEach(s => {
                const status = s.isBlocked || s.status === 'blocked' ? 'BLOCKED' : 'ACTIVE';
                const startTime = s.startTime ? new Date(s.startTime).toLocaleString('id-ID') : '-';
                csv += `"${s.name}","${s.kelas}","${s.number}",${s.violations || 0},${status},"${startTime}"\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `data-ujian-${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
            window.URL.revokeObjectURL(url);
            
            updateDebug(`📥 Export ${students.length} data ke CSV`, 'success');
        };

        // ==========================================
        // SEARCH/FILTER
        // ==========================================
        window.filterTable = function() {
            renderTable();
        };

        // ==========================================
        // FORCE REFRESH
        // ==========================================
        window.forceRefresh = function() {
            updateDebug('🔄 Refreshing data...', 'success');
            db.ref('exams').once('value')
                .then(snap => {
                    allStudents = snap.val() || {};
                    renderTable();
                    updateStats();
                    checkDuplicates();
                    updateDebug('✅ Data refreshed', 'success');
                })
                .catch(err => {
                    updateDebug(`❌ Refresh error: ${err.message}`, 'error');
                });
        };

        // ==========================================
        // UTILITIES
        // ==========================================
        function updateDebug(message, type) {
            debugEl.className = `debug-info ${type}`;
            debugText.textContent = message;
            console.log(`[DEBUG] ${message}`);
        }

        function escapeHtml(text) {
            if (!text) return '';
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // ==========================================
        // START APP
        // ==========================================
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
